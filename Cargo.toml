[package]
name = "forge-rs"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
description = "Manage files in a central directory with symlinks and portable configuration packs"
authors = ["jwl"]
license = "GPL-3.0-or-later"
repository = "https://github.com/jwliles/rust-forge"
keywords = ["symlink", "dotfiles", "stow", "configuration"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "forge_rs"
path = "src/lib.rs"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
tempfile = "3.27"
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
dirs = "7.0"
anyhow = "1.0"
walkdir = "2.5"
toml = "1.1.8"
zip = { version = "9.0.3", default-features = false, features = ["aes-crypto", "bzip2", "deflate", "time", "zstd"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_mangen = "0.3.3"

[dev-dependencies]
assert_cmd = "2.2"
assert_fs = "1.1"
predicates = "3.1"
